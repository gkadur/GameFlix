spring.application.name=demo
# DATASOURCE CONFIGURATION
spring.datasource.url=jdbc:mysql://localhost:3306/demo30?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# JPA / HIBERNATE PROPERTIES
# Hibernate 6 (Spring Boot 3) automatically detects the best dialect
spring.jpa.hibernate.ddl-auto=update
#The above shows how I've chosen update for this setting.
spring.jpa.show-sql=true

# LOGGING
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.results=TRACE

jwt.secret=${JWT_SECRET}